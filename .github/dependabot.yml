version: 2
updates:
  # pnpm dependencies (Dependabot reads pnpm-lock.yaml under the npm ecosystem)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    # Wait 3 days after a release before proposing a version update
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(dev-deps)"
    groups:
      # Framework and UI runtime move together with Next.js releases
      next:
        patterns:
          - "next"
          - "eslint-config-next"
        update-types:
          - "minor"
          - "patch"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-markdown"
          - "remark-gfm"
      ui:
        patterns:
          - "@base-ui/*"
          - "shadcn"
          - "lucide-react"
          - "class-variance-authority"
          - "next-themes"
          - "tw-animate-css"
        update-types:
          - "minor"
          - "patch"
      # Everything else: safe batch, majors stay as separate PRs
      minor-and-patch:
        patterns:
          - "*"
        exclude-patterns:
          - "next"
          - "eslint-config-next"
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
          - "react-markdown"
          - "remark-gfm"
          - "@base-ui/*"
          - "shadcn"
          - "lucide-react"
          - "class-variance-authority"
          - "next-themes"
          - "tw-animate-css"
        update-types:
          - "minor"
          - "patch"
    labels:
      - "dependencies"
  # GitHub Actions used by .github/workflows/docker.yml
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 3
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns:
          - "*"
    labels:
      - "dependencies"
      - "ci"
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Berlin"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(docker)"
    ignore:
      - dependency-name: "node"
        update-types:
          - "version-update:semver-major"
    labels:
      - "dependencies"
      - "docker"
