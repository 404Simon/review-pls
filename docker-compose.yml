services:
  app:
    build: .
    image: review-pls:latest
    container_name: review-pls
    restart: unless-stopped

    # Only expose the port on the host loopback interface; the reverse proxy
    # (nginx, Caddy, Traefik, ...) terminates TLS and forwards to it.
    ports:
      - "127.0.0.1:3000:3000"

    environment:
      # Public URL the app is reached at behind the proxy (https, no trailing slash).
      BETTER_AUTH_URL: "https://review.example.com"

      # At least 32 characters. Generate with: openssl rand -base64 48
      BETTER_AUTH_SECRET: "replace-with-a-random-secret-at-least-32-chars"

      # Invite code required to sign up. Keep it out of version control.
      REGISTRATION_CODE: "replace-with-a-registration-code"

      # SQLite file inside the container; keep it on the bind mount below.
      DATABASE_URL: "/data/review.db"

      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"

    volumes:
      # Bind mount the SQLite database (and its -wal/-shm files).
      # The directory must exist and be writable by uid 1000:
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
