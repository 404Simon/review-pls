services:
  app:
    image: ${REVIEW_PLS_IMAGE:-ghcr.io/404simon/review-pls:latest}
    container_name: review-pls
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file:
      - ${DEPLOY_ENV_FILE:-./deploy.env}
    environment:
      NODE_ENV: "production"
      PORT: "3000"
      HOSTNAME: "0.0.0.0"
      DATABASE_URL: "/data/review.db"
      REVIEW_DATA_ROOT: "/data/reviews"
    # Only expose the port on the host loopback interface; the reverse proxy
    # (nginx, Caddy, Traefik, ...) terminates TLS and forwards to it.
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      # SQLite database plus its -wal/-shm files. The host directory must be
      # writable by uid 1000 (the container's node user):
      #   mkdir -p data && sudo chown -R 1000:1000 data
      - ./data:/data
      # Prepared review data is mounted read-only. Never commit it, and make it
      # readable by the container's node user:
      #   chmod -R a+rX ./review-data
      - ./review-data:/data/reviews:ro
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
